            pointerNDC.set(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            pointerX = e.clientX;
            pointerY = e.clientY;
            const picked = pickStar();
            if (picked >= 0) {
                starDive = focusedStar === picked ? !starDive : true;
                focusedStar = picked;
            } else {
                focusedStar = -1;
                starDive = false;
            }
        });
        btnAuto.onclick = () => {
            state.auto = !state.auto;
            textAuto.textContent = state.auto ? 'AUTO: ON' : 'AUTO: OFF';
            iconAuto.className = state.auto ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        };
        // free roaming is the default now: the dive is on the wheel, not on a timer
        textAuto.textContent = 'AUTO: OFF';
        state.auto = false;
        iconAuto.className = 'fa-solid fa-play';
        btnSpeed.onclick = () => {
            state.direction *= -1;
            textDir.textContent = state.direction > 0 ? 'INWARD' : 'OUTWARD';
            iconDir.className = state.direction > 0
                ? 'fa-solid fa-forward text-sky-400'
                : 'fa-solid fa-backward text-sky-400';
        };
        btnReset.onclick = () => {
            for (const c of chains) {
                c.depth = 0;
                c.targetDepth = 0;
                c.pivot.copy(c.origin);
            }
            active = chains[0];
            state.depth = 0;
            state.targetDepth = 0;
            state.eye.set(0, 1.0, 8.0);
            state.yaw = 0;
            state.pitch = -0.08;
            focusedStar = -1;
            starDive = false;
        };
        /* ================================================================
           FRAME LOOP
           ================================================================ */
        function formatMag(v) {
            if (v < 1000) return v.toFixed(0);
            if (v < 1e6) return (v / 1000).toFixed(1) + 'k';
            const e = Math.floor(Math.log10(v));
            return (v / Math.pow(10, e)).toFixed(1) + 'e' + e;
        }
        function sizeLabel(depth) {
            const exp = depth * Math.log10(CFG.S);
            if (exp >= -2) {
                const m = Math.pow(10, exp);
                return m >= 0.01 ? (m * 100).toFixed(1) + ' cm' : (m * 1000).toFixed(2) + ' mm';
            }
            return '10^' + exp.toFixed(1) + ' m';
        }
        let lastFrame = performance.now();
        let hudClock = 0;
        let lastDepthApplied = 0;
        let lastStage = '';
        let fpsFrames = 0;
        let fpsWindow = 0;
        function update(dt) {
            /* ---- fps counter: raw frames per second, no smoothing cap ---- */
            fpsFrames++;
            fpsWindow += dt;
            if (fpsWindow >= 0.2) {
                fpsValue.textContent = String(Math.round(fpsFrames / fpsWindow));
                fpsFrames = 0;
                fpsWindow = 0;
            }
            /* ================================================================
               FREE FLIGHT
               WASD moves the camera itself along its own axes. Nothing is
               re-derived from a rail each frame, so the view never gets
               snapped back or dragged toward the core while you fly or
               look around - the dive only runs when you go idle.
               ================================================================ */
            const moving =
                keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'] ||
                keys['ArrowUp'] || keys['ArrowDown'] || keys['ArrowLeft'] || keys['ArrowRight'] ||
                keys['Space'] || keys['ShiftLeft'] || keys['ShiftRight'];
            state.idle = (moving || dragging) ? 0 : state.idle + dt;
            /* plain freecam: WASD moves the eye, the mouse is the only thing
               that turns it. Nothing else touches camera position or rotation. */
            const fly = 1200 * dt * tune.move;
            camEuler.set(state.pitch, state.yaw, 0, 'YXZ');
            camFwd.set(0, 0, -1).applyEuler(camEuler);
            camRight.set(1, 0, 0).applyEuler(camEuler);
            if (keys['KeyW'] || keys['ArrowUp']) state.eye.addScaledVector(camFwd, fly);
            if (keys['KeyS'] || keys['ArrowDown']) state.eye.addScaledVector(camFwd, -fly);
            if (keys['KeyD'] || keys['ArrowRight']) state.eye.addScaledVector(camRight, fly);
            if (keys['KeyA'] || keys['ArrowLeft']) state.eye.addScaledVector(camRight, -fly);
            if (keys['Space']) state.eye.y += fly;
            if (keys['ShiftLeft'] || keys['ShiftRight']) state.eye.y -= fly;
            camera.position.copy(state.eye);
            camera.rotation.set(state.pitch, state.yaw, 0);
            // stay inside the shell around the anchor, never fly into the void
            // (kept below, once the current scale is known)
            /* ---- the infinite dive only runs while the viewer is idle ---- */
            if (state.auto && state.idle > 1.5) {
                state.targetDepth += CFG.SPEED * dt * state.direction;
            }
            state.targetDepth = Math.max(0, state.targetDepth);
            const ease = 1 - Math.exp(-6 * dt);
            state.depth = Math.max(0, state.depth + (state.targetDepth - state.depth) * ease);
            /* ---- every exhibit keeps its own window and scale ---- */
            active.depth = state.depth;
            active.targetDepth = state.targetDepth;
            for (const c of chains) {
                // the pivot glides to whatever you aimed at instead of snapping
                c.pivot.lerp(c.pivotTarget, 1 - Math.exp(-10 * dt));
                ensureWindow(c);
            }
            /* ---- zoom is travel, not a magnifying glass: as the world scales
               about the pivot the viewer is carried in with it, so the whole
               player ends up inside the molecule. WASD still applies on top,
               so you can fly around while the dive is running. ---- */
            const dDepth = state.depth - lastDepthApplied;
            lastDepthApplied = state.depth;
            if (Math.abs(dDepth) > 1e-5) {
                const carry = Math.pow(CFG.S, dDepth * 1.15);
                camTmp.copy(state.eye).sub(active.pivot).multiplyScalar(carry);
                if (camTmp.lengthSq() < 1e-8) camTmp.set(1e-4, 0, 0);
                state.eye.copy(active.pivot).add(camTmp);
            }
            const base = Math.floor(state.depth);
            // the whole sky drifts, so the stars are alive too
            updateStars(dt);
            updateHover(dt);
            if (starDive && focusedStar >= 0 && !soloCore) {
                zoomAtPointer(-dt * 900 * tune.zoom);
            }
            updateStarLabels(dt);

            /* ---- living molecules: every shell turns, breathes and morphs ---- */
            const tNow = ATOM_TIME.value;
            /* one breath for the whole exhibit, applied at the root: every
               shell grows by the exact same factor, so the nesting can never
               open a gap or overlap - and crossing a fold cannot pop the
               picture, because no level carries a phase of its own */
            const breathe = 1 + 0.03 * Math.sin(tNow * 0.9);
            for (const c of chains) {
                const cBase = Math.floor(c.depth);
                for (const [index, level] of c.levels) {
                    level.rotation.y += dt * 0.16 * (index % 2 ? 1 : -1);
                    level.rotation.x += dt * 0.07 * (index % 3 === 0 ? -1 : 0.6);
                    level.scale.setScalar(Math.pow(CFG.S, index - cBase));
                }
                c.root.scale.setScalar((c.baseScale || 1) * breathe);
            }
            /* the camera is purely the freecam above: the zoom lives entirely
               in each exhibit's own scale, so nothing can turn or drag it. */
            camera.position.copy(state.eye);
            camera.rotation.set(state.pitch, state.yaw, 0);
            /* ---- animate the atom plasma + the wall's atom field ---- */
            ATOM_TIME.value += dt;
            /* ---- the whole molecule drifts through random colours ---- */
            if (colorCycle) {
                colorClock += dt;
                ATOM_CYCLE.value = Math.min(1, ATOM_CYCLE.value + dt * 2.5);
                if (colorClock > 0.45) {
                    colorClock = 0;
                    cycleTarget.setHSL(Math.random(), 0.85, 0.62);
                }
                ATOM_TINT.value.lerp(cycleTarget, Math.min(1, dt * 3.2));
            } else {
                ATOM_CYCLE.value = Math.max(0, ATOM_CYCLE.value - dt * 3);
            }
            /* ---- every proton, neutron and electron glows: the emissive tint
               cycles through the spectrum, the pulse breathes, and the closer
               you magnify the hotter the atoms burn. Scrolling is the only
               magnify control, and it is unbounded. ---- */
            const tGlow = ATOM_TIME.value;
            /* no lights, no emission: nothing brightens as you dive, so every
               layer of the molecule stays readable at any magnification. */
            /* ---- HUD ---- */
            hudClock += dt;
            if (hudClock > 0.08) {
                hudClock = 0;
                labelMag.textContent = '×' + formatMag(Math.pow(1 / CFG.S, state.depth));
                labelScale.textContent = sizeLabel(state.depth);
                sliderZoom.value = String(Math.min(1000, (state.depth / SLIDER_SPAN) * 1000));
                // how many molecules are alive in the universe right now
                moleculeCountEl.textContent = soloCore ? '1' : String(starSlots.length + CORE_CLONES.length + 1);
                const liveLevel = active.levels.get(base);
                if (liveLevel) {
                    const stage = `${liveLevel.userData.name.toUpperCase()} · ${KIND_LABELS[liveLevel.userData.kind]} · C${base}`;
                    if (stage !== lastStage) {
                        stageLabel.textContent = stage;
                        lastStage = stage;
                    }
                }
            }
            checkMilestones(state.depth);
        }
        /* ================================================================
           UNCAPPED PRESENTATION
           requestAnimationFrame is vsync-locked to the display refresh, so
           it can physically never report more than 60/120/144 fps. This
           loop runs on a MessageChannel instead: no vsync, no frame
           limiter, no cap at all. It renders as fast as the machine allows
           and the HUD reports the real throughput. It still yields between
           frames, and parks itself while the tab is hidden so a background
           tab cannot spin the fans.
           ================================================================ */
        /* A MessageChannel loop has no vsync, so it happily submits frames far
           faster than the GPU drains them. That is what made a 300 "fps"
           readout feel laggy: the queue keeps growing, so what you see lags
           further and further behind your input. A 1x1 read from the back
           buffer forces the frame to actually finish before the next one is
           queued - still no artificial cap, the loop runs flat out, but the
           HUD now reports frames the GPU really completed and latency stays
           at one frame. */
        const frameChannel = new MessageChannel();
        const glSync = renderer.getContext();
        const glPixel = new Uint8Array(4);
        let loopOn = true;
        let loopQueued = false;
        const drainGPU = () => {
            try {
                glSync.readPixels(0, 0, 1, 1, glSync.RGBA, glSync.UNSIGNED_BYTE, glPixel);
            } catch (err) {
                try { glSync.finish(); } catch (e) { /* driver says no - fine */ }
            }
        };
        const queueFrame = () => {
            if (!loopOn || loopQueued) return;
            loopQueued = true;
            frameChannel.port2.postMessage(0);
        };
        const pump = () => {
            loopQueued = false;
            if (!loopOn) return;
            const now = performance.now();
            const dt = Math.min((now - lastFrame) / 1000, 0.05);
            lastFrame = now;
            update(dt);
            renderer.render(scene, camera);
            drainGPU();            // never queue faster than the GPU can drain
            queueFrame();
        };
        frameChannel.port1.onmessage = pump;
        document.addEventListener('visibilitychange', () => {
            loopOn = !document.hidden;
            if (loopOn) {
                lastFrame = performance.now();
                queueFrame();
            }
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
        queueFrame();
    </script>
    <div id="star-labels" aria-hidden="true"></div>
    <div id="star-tip" style="position:fixed;left:0;top:0;z-index:40;pointer-events:none;opacity:0;transform:translate(-50%,-150%);transition:opacity .12s ease;">
        <div style="background:rgba(8,10,18,.92);border:1px solid rgba(56,189,248,.45);box-shadow:0 0 18px rgba(56,189,248,.3);border-radius:10px;padding:6px 10px;white-space:nowrap;">
            <div id="star-tip-name" style="font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.12em;color:#7dd3fc;font-weight:700;">MOLECULE</div>
            <div id="star-tip-meta" style="font-family:monospace;font-size:10px;color:#a1a1aa;margin-top:2px;">-</div>
        </div>
    </div>
</body>
</html>
